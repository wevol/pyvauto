name: Go

# Path-filtered: only runs when the Go code, the shared fixtures, or the Python
# oracle change (the parity job compares Go output against Python).
on:
  push:
    branches: [main]
    paths:
      - 'go/**'
      - 'tests/**'
      - 'pyvauto.py'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'go/**'
      - 'tests/**'
      - 'pyvauto.py'
      - '.github/workflows/go.yml'

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.21'
          cache: false
      - name: Vet & test
        working-directory: go
        run: |
          go vet ./...
          go test ./...

  lint:
    # golangci-lint bundles staticcheck/revive/gocritic/misspell; config lives
    # in go/.golangci.yml. `fmt --diff` fails the job on unformatted code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.21'
          cache: false
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.1.6/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.1.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint
        working-directory: go
        run: golangci-lint run ./...
      - name: Check formatting
        working-directory: go
        run: golangci-lint fmt --diff ./...

  parity:
    # Regenerate the goldens from the Python reference, then confirm the Go
    # output still matches — catches the two implementations drifting apart.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.21'
          cache: false
      - name: Sync Python deps
        run: uv sync
      - name: Regenerate goldens from the Python oracle
        run: bash go/testdata/gen_golden.sh
      - name: Go must match the freshly generated goldens
        working-directory: go
        run: go test ./internal/verilog/ -run 'Golden|Corpus'
