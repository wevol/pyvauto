name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # Python counterpart to the Go workflow's lint job. Config lives in
    # pyproject.toml under [tool.ruff] and [tool.pyright].
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Vim (for plugin integration tests)
        run: sudo apt-get update && sudo apt-get install -y vim

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run --with pytest python -m pytest tests/ -v
