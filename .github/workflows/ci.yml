name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # Python counterpart to the Go workflow's lint job. Config lives in
    # pyproject.toml under [tool.ruff] and [tool.pyright].
    runs-on: ubuntu-latest
    # 10 minutes is ~15x the observed runtime; it exists to cap a hung
    # step (a stuck apt mirror once burned 20 min) against the 6h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Vim (for plugin integration tests)
        # Retried: a flaky apt mirror is the one step here that has actually
        # stalled a run, and it is pure infrastructure, not a real failure.
        run: |
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get update -qq \
               && timeout 180 sudo apt-get install -y -qq vim; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::apt failed after 3 attempts"
          exit 1

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run --with pytest python -m pytest tests/ -v
